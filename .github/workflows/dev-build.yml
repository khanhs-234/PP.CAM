name: dev-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;30.0.3" "platforms;android-28"

      - name: Build PPCAM APK
        env:
          ANDROID_SDK: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPCAM-dev
          path: PPCAM-dev.apk

      - name: Create or Update GitHub Dev Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          gh release create dev PPCAM-dev.apk \
            --title "PP.CAM dev build" \
            --notes "Bản build tự động cho máy ảnh Sony A7 Mark II (PP7 slot overwrite)." \
            --prerelease
